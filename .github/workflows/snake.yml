# Generates the contribution snake used in README.md and pushes the rendered
# SVG to the `output` branch, which the README links to directly. Without this
# workflow that image is a permanent 404 -- the snake is not a hosted service,
# it is a file this repo builds for itself.
name: Generate contribution snake

on:
  schedule:
    # Twice a day is plenty; the graph only changes as commits land.
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Render snake from the contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
